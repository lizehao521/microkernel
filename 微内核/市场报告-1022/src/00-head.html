<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentkernel 市场进入重评 · 2026-10-20</title>
<style>
:root{
  --navy:#0b1f33; --navy2:#12314f; --teal:#0f766e; --teal2:#14b8a6;
  --amber:#b45309; --red:#b91c1c; --green:#15803d; --ink:#172033;
  --muted:#5b6b7f; --line:#d9e2ec; --bg:#f6f8fb; --soft:#eef4f8;
}
@page{ size:A4; margin:19mm 15mm 18mm 15mm; }
html{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
body{
  margin:0; color:var(--ink);
  font-family:"Microsoft YaHei","Noto Sans SC","Segoe UI",sans-serif;
  font-size:10.3pt; line-height:1.78;
}
p{ margin:0 0 7pt; text-align:justify; text-justify:inter-ideograph; }
a{ color:var(--teal); text-decoration:none; }
b,strong{ color:#0b1f33; }
em{ font-style:normal; color:var(--amber); }
.small{ font-size:8.8pt; line-height:1.6; color:var(--muted); }
.tiny{ font-size:8pt; line-height:1.55; color:var(--muted); }
.center{ text-align:center; }
.right{ text-align:right; }
.nowrap{ white-space:nowrap; }
.mono{ font-family:"Cascadia Mono","Consolas","Segoe UI",monospace; font-size:8.6pt; }
.muted{ color:var(--muted); }
.teal{ color:var(--teal); }
.red{ color:var(--red); }
.amber{ color:var(--amber); }
.green{ color:var(--green); }
.rule{ height:1px; background:var(--line); margin:14pt 0; }
.pagebreak{ page-break-before:always; }
.avoid{ break-inside:avoid; page-break-inside:avoid; }

/* ---------- cover ---------- */
.cover{
  height:259mm; box-sizing:border-box; margin:0; padding:26mm 20mm 16mm;
  background:linear-gradient(145deg,#081827 0%,#0b1f33 52%,#12314f 100%);
  color:#fff; position:relative; overflow:hidden; page-break-after:always;
}
.cover .grid{
  position:absolute; inset:0; opacity:.16;
  background-image:
    linear-gradient(rgba(255,255,255,.14) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.14) 1px,transparent 1px);
  background-size:11mm 11mm;
}
.cover .glow{
  position:absolute; width:120mm; height:120mm; right:-38mm; top:-30mm;
  background:radial-gradient(circle,rgba(20,184,166,.38),rgba(20,184,166,0) 68%);
}
.cover .glow2{
  position:absolute; width:90mm; height:90mm; left:-30mm; bottom:-28mm;
  background:radial-gradient(circle,rgba(180,83,9,.24),rgba(180,83,9,0) 70%);
}
.cover .inner{ position:relative; z-index:2; }
.cover .kicker{
  font-size:8.6pt; letter-spacing:.22em; color:#8fd8cf; text-transform:uppercase;
  margin-bottom:10mm;
}
.cover h1{
  font-size:31pt; line-height:1.28; margin:0 0 6mm; font-weight:700; letter-spacing:.01em;
  border:0; padding:0; color:#fff;
}
.cover h1 .thin{ font-weight:300; color:#b9d7e8; }
.cover .sub{
  font-size:12.6pt; line-height:1.8; color:#d4e4ef; max-width:158mm; margin-bottom:9mm;
}
.cover .object{
  display:inline-block; border:1px solid rgba(143,216,207,.45); border-radius:2px;
  padding:3mm 5mm; font-size:9.2pt; color:#d9f3ee; margin-bottom:10mm;
}
.cover .verdict{
  border-left:3px solid var(--teal2); background:rgba(255,255,255,.07);
  padding:5mm 6mm; max-width:165mm; margin-bottom:8mm;
}
.cover .verdict .lab{ font-size:8pt; letter-spacing:.16em; color:#8fd8cf; margin-bottom:2mm; }
.cover .verdict .txt{ font-size:13.2pt; line-height:1.7; color:#fff; }
/* 全局 b,strong 是给浅色页用的深墨（#0b1f33）；落进封面这块深色底就读不出来了。
   这条作用域规则修的是肉眼开图看到的对比度缺陷，不是美化。 */
.cover .verdict .txt b, .cover .verdict .txt strong{ color:#ffd9a0; font-weight:700; }
.cover .sub strong, .cover .object strong, .cover .foot strong{ color:#cfe6ff; }
.cover .stats{ width:100%; border-collapse:collapse; margin-top:4mm; }
.cover .stats td{ border-top:1px solid rgba(255,255,255,.18); padding:4mm 3mm 0 0; vertical-align:top; }
.cover .stats .v{ font-size:17pt; color:#8fd8cf; font-weight:700; line-height:1.2; }
.cover .stats .l{ font-size:7.8pt; color:#a9c4d6; line-height:1.5; margin-top:1mm; }
.cover .foot{
  position:absolute; left:20mm; right:20mm; bottom:13mm; z-index:2;
  border-top:1px solid rgba(255,255,255,.18); padding-top:3mm;
  font-size:8pt; color:#9fb9cc; line-height:1.6;
}

/* ---------- headings ---------- */
.chapter{ page-break-before:always; }
h1{
  font-size:21pt; line-height:1.35; color:var(--navy); margin:0 0 4mm;
  padding-bottom:3mm; border-bottom:2px solid var(--navy); font-weight:700;
  break-after:avoid;
}
h1 .num{
  display:inline-block; min-width:13mm; color:var(--teal); font-size:12pt;
  letter-spacing:.08em; vertical-align:3pt; margin-right:2mm;
}
h2{
  font-size:13.6pt; line-height:1.45; color:var(--navy2); margin:9mm 0 3mm;
  padding-left:3mm; border-left:3px solid var(--teal); font-weight:700;
  break-after:avoid;
}
h3{
  font-size:10.9pt; color:#0f3a5c; margin:6mm 0 2mm; font-weight:700; break-after:avoid;
}
h4{ font-size:10.2pt; color:var(--ink); margin:4mm 0 1.5mm; font-weight:700; break-after:avoid; }
.lede{ font-size:11.4pt; line-height:1.85; color:#24384d; margin-bottom:6mm; }
.chap-kicker{ font-size:8pt; letter-spacing:.18em; color:var(--teal); margin:0 0 2mm; text-transform:uppercase; }
.chap-q{
  background:var(--soft); border:1px solid var(--line); border-left:4px solid var(--teal);
  padding:3.5mm 5mm; margin:0 0 7mm; font-size:10.4pt; color:#24384d;
}
.chap-q b{ color:var(--navy); }

/* ---------- callouts ---------- */
.callout{
  border:1px solid var(--line); border-left:4px solid var(--teal);
  background:#f3faf8; padding:3.5mm 5mm; margin:4mm 0 6mm;
  break-inside:avoid; page-break-inside:avoid;
}
.callout.warn{ border-left-color:var(--amber); background:#fff8ed; }
.callout.danger{ border-left-color:var(--red); background:#fdf2f2; }
.callout.neutral{ border-left-color:#64748b; background:#f8fafc; }
.callout .t{ font-weight:700; color:var(--navy); margin-bottom:1.5mm; font-size:10pt; }
.callout p:last-child{ margin-bottom:0; }
.quote{
  margin:5mm 0; padding:3mm 0 3mm 6mm; border-left:2px solid #94a3b8;
  color:#334155; font-size:10.6pt; line-height:1.8;
}
.quote .who{ display:block; margin-top:2mm; font-size:8.4pt; color:var(--muted); }

/* ---------- badges ---------- */
.tag{
  display:inline-block; font-size:7.6pt; line-height:1.5; padding:0 3.2pt;
  border-radius:2px; margin:0 2pt 0 0; vertical-align:1pt; font-weight:700;
  letter-spacing:.02em;
}
.tag-a{ background:#dcfce7; color:#166534; border:1px solid #86efac; }
.tag-b{ background:#dbeafe; color:#1e40af; border:1px solid #93c5fd; }
.tag-c{ background:#fef3c7; color:#92400e; border:1px solid #fcd34d; }
.tag-d{ background:#ede9fe; color:#5b21b6; border:1px solid #c4b5fd; }
.tag-x{ background:#fee2e2; color:#991b1b; border:1px solid #fca5a5; }
.tag-gray{ background:#e2e8f0; color:#334155; border:1px solid #cbd5e1; }

/* ---------- metrics ---------- */
.metrics{ width:100%; border-collapse:collapse; margin:4mm 0 6mm; }
.metrics td{
  width:25%; vertical-align:top; padding:3.5mm 3mm;
  border-top:2px solid var(--navy); background:#f8fafc;
}
.metrics .v{ font-size:16pt; font-weight:700; color:var(--navy); line-height:1.25; }
.metrics .l{ font-size:8pt; color:var(--muted); line-height:1.55; margin-top:1.5mm; }

/* ---------- tables ---------- */
table.tbl{
  width:100%; border-collapse:collapse; margin:3mm 0 5mm;
  font-size:8.7pt; line-height:1.55;
}
table.tbl caption{
  caption-side:top; text-align:left; font-size:8.4pt; color:var(--muted);
  padding:0 0 2mm; font-weight:400;
}
table.tbl caption b{ color:var(--navy); }
table.tbl th{
  background:var(--navy); color:#fff; font-weight:700; text-align:left;
  padding:2.2mm 2.2mm; border:1px solid var(--navy); vertical-align:bottom;
}
table.tbl td{
  padding:2mm 2.2mm; border:1px solid var(--line); vertical-align:top;
}
table.tbl tr:nth-child(even) td{ background:#f8fafc; }
table.tbl tr{ break-inside:avoid; page-break-inside:avoid; }
table.tbl td.num, table.tbl th.num{ text-align:right; white-space:nowrap; }
table.tbl .em-row td{ background:#f0fdfa !important; font-weight:700; }
table.tbl .warn-row td{ background:#fff7ed !important; }
table.tbl .danger-row td{ background:#fef2f2 !important; }
table.tbl .ok{ color:var(--green); font-weight:700; }
table.tbl .no{ color:var(--red); font-weight:700; }
table.tbl .mid{ color:var(--amber); font-weight:700; }

/* ---------- figures ---------- */
figure{
  margin:4mm 0 6mm; padding:0; break-inside:avoid; page-break-inside:avoid;
  border:1px solid var(--line); background:#fff;
}
figure .pad{ padding:4mm 4mm 2mm; }
figure svg{ display:block; width:100%; height:auto; }
figcaption{
  font-size:8.3pt; line-height:1.6; color:var(--muted);
  padding:2.5mm 4mm 3mm; border-top:1px solid #eef2f7;
}
figcaption b{ color:var(--navy); }
.figsrc{ font-size:7.6pt; color:#7c8b9d; }

/* ---------- toc ---------- */
.toc-page{ page-break-before:always; }
.toc-title{ font-size:19pt; color:var(--navy); margin:0 0 2mm; border:0; padding:0; }
table.toc{ width:100%; border-collapse:collapse; font-size:9.2pt; line-height:1.35; margin-top:2mm; }
table.toc td{ padding:1.5pt 0; border-bottom:1px dotted #c7d3df; vertical-align:bottom; }
table.toc td.pg{ width:12mm; text-align:right; color:var(--muted); font-size:8.8pt; }
table.toc tr.l1 td{ font-weight:700; color:var(--navy); padding-top:3pt; }
table.toc tr.l2 td:first-child{ padding-left:8mm; font-weight:400; color:#334155; font-size:8.6pt; }
table.toc tr.l2 td.pg{ font-size:8.4pt; }
table.toc .tn{ display:inline-block; min-width:9mm; color:var(--teal); font-size:8.4pt; }

/* ---------- lists ---------- */
ul,ol{ margin:0 0 6pt 0; padding-left:16pt; }
li{ margin:0 0 2.2pt; text-align:justify; }
ul.tight li, ol.tight li{ margin-bottom:1pt; }
.checklist{ list-style:none; padding-left:0; }
.checklist li{ padding-left:12pt; text-indent:-12pt; }
.checklist li:before{ content:"□"; color:var(--teal); font-weight:700; margin-right:4pt; }
.kv{ width:100%; border-collapse:collapse; font-size:9pt; }
.kv td{ padding:1.6mm 0; border-bottom:1px solid #eef2f7; vertical-align:top; }
.kv td:first-child{ width:32mm; color:var(--muted); }
.grid2{ width:100%; border-collapse:separate; border-spacing:5mm 0; margin-left:-5mm; margin-right:-5mm; }
.grid2 td{ width:50%; vertical-align:top; }
.grid3{ width:100%; border-collapse:separate; border-spacing:3mm 0; margin-left:-3mm; margin-right:-3mm; }
.grid3 td{ width:33.3%; vertical-align:top; }
.card{ border:1px solid var(--line); background:#fff; padding:3.5mm 4mm; height:100%; }
.card .h{ font-weight:700; color:var(--navy); font-size:9.6pt; margin-bottom:1.5mm; }
.card p{ font-size:8.8pt; line-height:1.65; margin-bottom:2mm; }
.card .foot{ font-size:8pt; color:var(--muted); }
.two-col{ column-count:2; column-gap:8mm; }
.two-col p{ break-inside:avoid; }
.endnote{ font-size:8pt; color:var(--muted); border-top:1px solid var(--line); padding-top:2mm; margin-top:6mm; }
.appendix h1{ font-size:18pt; }
.ref{ font-size:8.4pt; line-height:1.65; margin-bottom:2.4mm; padding-left:9mm; text-indent:-9mm; }
.ref .n{ color:var(--teal); font-weight:700; }
.sig{ font-size:8.4pt; color:var(--muted); margin-top:8mm; }
.v2badge{
  display:inline-block; font-size:7.8pt; letter-spacing:.14em; color:#0f766e;
  border:1px solid #99f6e4; background:#f0fdfa; padding:1mm 3mm; margin-bottom:3mm;
}
.diff-table td.old{ color:#7c2d12; background:#fff7ed; }
.diff-table td.new{ color:#14532d; background:#f0fdf4; }
.flow{
  border:1px solid var(--line); background:#f8fafc; padding:3.5mm 4mm; margin:4mm 0 6mm;
  font-size:9pt; line-height:1.9; break-inside:avoid; page-break-inside:avoid;
}
.flow b{ color:var(--navy); }
.flow .arrow{ color:var(--teal); font-weight:700; padding:0 2mm; }
</style>
</head>
<body>
